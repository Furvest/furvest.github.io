<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Taptic Engine тест · iPhone</title>
    <style>
        :root {
            --bg: #0b0b0f;
            --surface: #1c1c24;
            --surface-light: #2a2a33;
            --text: #f5f5f7;
            --text-secondary: #98989f;
            --accent: #0a84ff;
            --accent-glow: rgba(10, 132, 255, 0.6);
            --green: #30d158;
            --red: #ff453a;
            --yellow: #ffd60a;
            --border-radius: 28px;
            --transition: 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Helvetica Neue', sans-serif;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
            background-image: radial-gradient(circle at 20% 20%, #1a1a22 0%, #0b0b0f 70%);
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--surface);
            border-radius: 40px;
            padding: 32px 24px 28px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            backdrop-filter: blur(2px);
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            text-align: center;
            color: var(--text);
        }

        .subhead {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 28px;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        .test-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .test-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-light);
            border: none;
            border-radius: var(--border-radius);
            padding: 18px 20px;
            width: 100%;
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            letter-spacing: -0.01em;
        }

        .test-btn:active {
            transform: scale(0.97);
            background: #30303a;
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        .btn-icon {
            font-size: 1.5rem;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.2));
        }

        .intensity-indicator {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            transition: 0.1s;
        }
        .dot.active {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .stop-btn {
            background: #2c1e1e;
            border: 1px solid rgba(255, 69, 58, 0.4);
            color: #ff8a80;
            margin-top: 10px;
            font-weight: 600;
            letter-spacing: -0.01em;
            justify-content: center;
            gap: 10px;
        }
        .stop-btn:active {
            background: #3a2020;
        }

        .status-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
            padding: 14px;
            border-radius: 22px;
            background: rgba(0, 0, 0, 0.4);
            font-size: 0.95rem;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            transition: 0.2s;
        }
        .status-dot.error {
            background: var(--red);
            box-shadow: 0 0 8px var(--red);
        }

        .footnote {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-align: center;
            margin-top: 16px;
            opacity: 0.7;
            letter-spacing: 0.02em;
        }

        @media (max-width: 400px) {
            .container {
                padding: 24px 16px 20px;
                border-radius: 32px;
            }
            .test-btn {
                padding: 16px 18px;
                font-size: 1rem;
            }
            h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡️ Taptic Engine</h1>
        <div class="subhead">Проверка виброотклика iPhone</div>

        <div class="test-grid">
            <!-- Лёгкая вибрация -->
            <button class="test-btn" data-pattern="light" data-duration="10">
                <span>🫧 Лёгкий отклик</span>
                <span class="btn-icon">▎</span>
            </button>
            
            <!-- Средняя вибрация (одна) -->
            <button class="test-btn" data-pattern="medium" data-duration="40">
                <span>🔔 Средний сигнал</span>
                <span class="btn-icon">◉</span>
            </button>

            <!-- Сильная вибрация (двойной пульс) -->
            <button class="test-btn" data-pattern="strong" data-duration="25">
                <span>💥 Сильный удар</span>
                <span class="btn-icon">◍</span>
            </button>

            <!-- Специальный ритм: SOS -->
            <button class="test-btn" data-pattern="sos" data-duration="150">
                <span>🆘 Ритм SOS</span>
                <span class="btn-icon">⋯</span>
            </button>

            <!-- Длинная непрерывная вибрация (2 сек) -->
            <button class="test-btn" data-pattern="continuous" data-duration="2000">
                <span>📳 Непрерывная вибрация</span>
                <span class="btn-icon">≡</span>
            </button>

            <!-- Случайный паттерн (короткие серии) -->
            <button class="test-btn" data-pattern="random" data-duration="300">
                <span>🎲 Случайный паттерн</span>
                <span class="btn-icon">✦</span>
            </button>
        </div>

        <!-- Кнопка остановки -->
        <button class="test-btn stop-btn" id="stopBtn">
            <span>⏹ Остановить вибрацию</span>
        </button>

        <!-- Статус и информация о поддержке -->
        <div class="status-area" id="statusArea">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Готов к тесту · используйте кнопки</span>
        </div>
        <div class="footnote">
            iOS поддерживает вибрацию через Web Vibration API<br>Работает на iPhone и iPad
        </div>
    </div>

    <script>
        (function() {
            // Проверка поддержки Vibration API
            const supportsVibration = 'vibrate' in navigator || 'webkitVibrate' in navigator;
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const stopBtn = document.getElementById('stopBtn');
            
            // Для надёжности используем и стандартный и префиксный
            const vibrate = (pattern) => {
                if (navigator.vibrate) {
                    return navigator.vibrate(pattern);
                } else if (navigator.webkitVibrate) {
                    return navigator.webkitVibrate(pattern);
                } else {
                    return false;
                }
            };

            // Обновляем статус в зависимости от поддержки
            function updateStatus(support) {
                if (!support) {
                    statusDot.classList.add('error');
                    statusText.textContent = '⚠️ Vibration API не поддерживается на этом устройстве';
                    return false;
                } else {
                    statusDot.classList.remove('error');
                    statusText.textContent = '✅ Вибрация поддерживается · нажмите кнопку';
                    return true;
                }
            }

            const vibrationSupported = updateStatus(supportsVibration);
            
            // Если поддержки нет – делаем кнопки неактивными (визуально и функционально)
            const testButtons = document.querySelectorAll('.test-btn[data-pattern]');
            if (!vibrationSupported) {
                testButtons.forEach(btn => {
                    btn.style.opacity = '0.5';
                    btn.style.pointerEvents = 'none';
                });
            } else {
                // Привязываем обработчики только если поддерживается
                testButtons.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        const patternType = this.dataset.pattern;
                        const duration = parseInt(this.dataset.duration, 10) || 50;
                        
                        // Останавливаем любую текущую вибрацию перед запуском новой
                        vibrate(0); // немедленная остановка
                        
                        let vibrationPattern = duration; // по умолчанию просто число (мс)
                        
                        switch (patternType) {
                            case 'light':
                                // короткий мягкий импульс 10мс (Taptic Engine лёгкий)
                                vibrationPattern = 10;
                                break;
                            case 'medium':
                                // средний одиночный удар 40мс
                                vibrationPattern = 40;
                                break;
                            case 'strong':
                                // Сильный ощутимый удар – два коротких импульса подряд
                                vibrationPattern = [25, 30, 25]; // вибрация 25мс, пауза 30мс, вибрация 25мс
                                break;
                            case 'sos':
                                // Ритм SOS: три коротких, три длинных, три коротких (с паузами)
                                vibrationPattern = [
                                    120, 80, 120, 80, 120,   // S: три коротких
                                    200,                     // пауза между буквами
                                    300, 80, 300, 80, 300,   // O: три длинных
                                    200,                     // пауза
                                    120, 80, 120, 80, 120    // S снова
                                ];
                                break;
                            case 'continuous':
                                // длинная непрерывная вибрация 2000 мс
                                vibrationPattern = 2000;
                                break;
                            case 'random':
                                // случайный паттерн: несколько коротких всплесков
                                vibrationPattern = [
                                    30, 50, 30, 50, 40, 
                                    80, 30, 60, 30, 
                                    100, 70, 30, 40, 20
                                ];
                                break;
                            default:
                                vibrationPattern = duration;
                        }
                        
                        // Запускаем вибрацию
                        const result = vibrate(vibrationPattern);
                        
                        if (result) {
                            // Обновляем статус
                            statusDot.classList.remove('error');
                            statusText.textContent = `▶️ Вибрация: ${getPatternName(patternType)}`;
                            
                            // Показываем активную точку индикатора (для наглядности, без реального UI)
                            // Дополнительно можно подсветить, но не обязательно
                        } else {
                            statusDot.classList.add('error');
                            statusText.textContent = '❌ Не удалось запустить вибрацию (API заблокирован?)';
                        }
                    });
                });
            }

            // Функция для человекочитаемого имени паттерна
            function getPatternName(type) {
                const names = {
                    'light': 'лёгкий',
                    'medium': 'средний',
                    'strong': 'сильный',
                    'sos': 'SOS',
                    'continuous': 'непрерывный',
                    'random': 'случайный'
                };
                return names[type] || type;
            }

            // Кнопка остановки вибрации
            stopBtn.addEventListener('click', function(e) {
                e.preventDefault();
                if (supportsVibration) {
                    vibrate(0); // останавливает вибрацию
                    statusDot.classList.remove('error');
                    statusText.textContent = '⏹️ Вибрация остановлена';
                } else {
                    statusDot.classList.add('error');
                    statusText.textContent = '⚠️ Нет поддержки вибрации';
                }
            });

            // Дополнительно: остановка при уходе со страницы (visibilitychange)
            document.addEventListener('visibilitychange', function() {
                if (document.hidden && supportsVibration) {
                    vibrate(0);
                }
            });

            // Предотвращаем двойной тап, но оставляем ощущение нажатия
            document.addEventListener('touchstart', function(e) {
                // Просто для предотвращения выделения
            }, { passive: true });

            // Инициализация статуса
            if (!supportsVibration) {
                statusDot.classList.add('error');
                statusText.textContent = '⚠️ Vibration API не найден';
            } else {
                statusDot.classList.remove('error');
                statusText.textContent = '✅ Taptic Engine готов';
            }
        })();
    </script>
</body>
</html>
