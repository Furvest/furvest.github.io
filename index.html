<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VK Top Post Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4a76a8 0%, #2b4a6f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #4a76a8;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #4a76a8;
            box-shadow: 0 0 0 3px rgba(74, 118, 168, 0.1);
        }
        button {
            padding: 15px 30px;
            background: #4a76a8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #3d6290;
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }
        .post-content {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 15px;
            word-wrap: break-word;
        }
        .stats {
            display: flex;
            gap: 20px;
            color: #666;
        }
        .likes-count {
            color: #e74c3c;
            font-weight: bold;
            font-size: 20px;
        }
        .error {
            color: #e74c3c;
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #ffeaea;
            border-radius: 10px;
        }
        .loading {
            text-align: center;
            color: #4a76a8;
            margin-top: 20px;
            display: none;
        }
        .post-link {
            color: #4a76a8;
            text-decoration: none;
            font-weight: bold;
        }
        .post-link:hover {
            text-decoration: underline;
        }
        .token-notice {
            font-size: 14px;
            color: #888;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Самый популярный пост VK</h1>
        
        <div class="input-group">
            <input type="text" id="groupId" placeholder="Введите ID группы (например: 123456 или club_name)" />
            <button onclick="findTopPost()" id="searchBtn">Найти</button>
        </div>
        
        <div class="loading" id="loading">⏳ Анализируем посты...</div>
        <div class="error" id="error" style="display: none;"></div>
        <div class="result" id="result" style="display: none;"></div>
        
        <div class="token-notice">
            ⚠️ Для работы нужен сервисный ключ доступа VK API. 
            <a href="https://vk.com/dev" target="_blank" style="color: #4a76a8;">Получить ключ</a>
        </div>
    </div>

    <script>
        // Замените на ваш сервисный ключ VK API
        const VK_API_KEY = 'YOUR_SERVICE_TOKEN'; // Получите на vk.com/dev
        
        async function findTopPost() {
            const groupId = document.getElementById('groupId').value.trim();
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            const searchBtn = document.getElementById('searchBtn');
            
            // Сброс состояний
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            
            if (!groupId) {
                showError('Введите ID группы');
                return;
            }
            
            if (VK_API_KEY === 'YOUR_SERVICE_TOKEN') {
                showError('Замените YOUR_SERVICE_TOKEN на ваш реальный ключ VK API');
                return;
            }
            
            loadingDiv.style.display = 'block';
            searchBtn.disabled = true;
            
            try {
                // Получаем ID группы (если передан screen_name)
                const groupRes = await fetch(`https://api.vk.com/method/groups.getById?v=5.131&group_id=${groupId}&access_token=${VK_API_KEY}`);
                const groupData = await groupRes.json();
                
                if (groupData.error) {
                    throw new Error(`Ошибка: ${groupData.error.error_msg}`);
                }
                
                const ownerId = -groupData.response[0].id; // Для групп owner_id отрицательный
                
                // Получаем посты со стены
                let allPosts = [];
                let offset = 0;
                const count = 100; // Максимум 100 за раз
                let hasMore = true;
                
                while (hasMore && offset < 500) { // Ограничим 500 постами
                    const wallRes = await fetch(
                        `https://api.vk.com/method/wall.get?v=5.131&owner_id=${ownerId}&count=${count}&offset=${offset}&access_token=${VK_API_KEY}`
                    );
                    const wallData = await wallRes.json();
                    
                    if (wallData.error) {
                        throw new Error(`Ошибка получения постов: ${wallData.error.error_msg}`);
                    }
                    
                    const posts = wallData.response.items;
                    allPosts = allPosts.concat(posts);
                    
                    if (posts.length < count) {
                        hasMore = false;
                    } else {
                        offset += count;
                    }
                }
                
                if (allPosts.length === 0) {
                    throw new Error('В этой группе нет постов');
                }
                
                // Находим пост с максимальным количеством лайков
                const topPost = allPosts.reduce((max, post) => {
                    return (post.likes.count > max.likes.count) ? post : max;
                });
                
                // Отображаем результат
                displayResult(topPost, groupData.response[0]);
                
            } catch (error) {
                showError(error.message);
            } finally {
                loadingDiv.style.display = 'none';
                searchBtn.disabled = false;
            }
        }
        
        function displayResult(post, group) {
            const resultDiv = document.getElementById('result');
            const postUrl = `https://vk.com/wall${post.owner_id}_${post.id}`;
            const date = new Date(post.date * 1000).toLocaleDateString('ru-RU');
            
            resultDiv.innerHTML = `
                <div class="post-content">
                    ${post.text ? post.text.substring(0, 500) : '📷 Пост без текста'}
                    ${post.text && post.text.length > 500 ? '...' : ''}
                </div>
                <div class="stats">
                    <span class="likes-count">❤️ ${post.likes.count.toLocaleString()} лайков</span>
                    <span>💬 ${post.comments.count.toLocaleString()} комментариев</span>
                    <span>🔄 ${post.reposts.count.toLocaleString()} репостов</span>
                    <span>👁️ ${post.views ? post.views.count.toLocaleString() : '0'} просмотров</span>
                </div>
                <p style="margin-top: 15px;">
                    📅 Опубликовано: ${date} | 
                    <a href="${postUrl}" target="_blank" class="post-link">Открыть пост →</a>
                </p>
                <p style="color: #888; margin-top: 10px;">
                    Группа: ${group.name} | Проанализировано постов: ${document.querySelector('.stats') ? 'много' : '0'}
                </p>
            `;
            
            resultDiv.style.display = 'block';
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.style.display = 'block';
        }
        
        // Поддержка Enter для поиска
        document.getElementById('groupId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                findTopPost();
            }
        });
    </script>
</body>
</html>
